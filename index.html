<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מבחני קירור</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--bg:#EDF2F4;--surface:#FFFFFF;--ink:#13232B;--muted:#5A6D77;--line:#D2DCE1;--low:#1F6FB2;--low-soft:#E1EDF7;--high:#C2392F;
  --display:"Secular One","Assistant",system-ui,sans-serif;--body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0D161B;--surface:#14212A;--ink:#E2EBEE;--muted:#8EA2AB;--line:#24363F;--low:#5BA7E6;--low-soft:#16304A;--high:#F0705F;color-scheme:dark}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.2;margin:0}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
input{font:inherit;font-weight:400;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible{outline:3px solid var(--low);outline-offset:1px}
.err{color:var(--high);font-weight:700;margin:0;font-size:.92rem}
.err:empty{display:none}
.go{font:inherit;font-weight:700;padding:12px 18px;border-radius:10px;border:none;background:var(--low);color:#fff;cursor:pointer;align-self:flex-start}
.go:focus-visible,.test:focus-visible,.back:focus-visible,.link:focus-visible{outline:3px solid var(--low);outline-offset:2px}
.test{font:inherit;color:inherit;text-align:right;display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.test:hover{border-color:var(--low)}
.n{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;background:var(--low-soft);color:var(--low)}
.tx{display:flex;flex-direction:column;gap:2px}
.tx b{font-size:1.08rem}
.tx span{color:var(--muted);font-size:.93rem}
.tx .cnt{color:var(--low);font-weight:700;font-size:.85rem}
.note{color:var(--muted);font-size:.88rem;margin:0}
.link{font:inherit;font-size:.9rem;color:var(--low);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;align-self:flex-start}
#viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.back{font:inherit;font-weight:700;font-size:.92rem;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.bar b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frame{flex:1 1 auto;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<div class="wrap" id="gate">
  <h1>מבחני קירור</h1>
  <p class="sub">כדי להיכנס צריך סיסמה ושם.</p>
  <form class="box" id="login" novalidate>
    <label>סיסמה<input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label>שם בעברית<input id="nm" type="text" maxlength="40" autocomplete="name" placeholder="לפחות 3 אותיות"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="go" type="submit">כניסה</button>
    <p class="note" id="lognote" hidden>השם שלך, ההתקדמות והציונים שלך יישלחו לראם.</p>
  </form>
</div>
<div class="wrap" id="list" hidden>
  <h1>מבחני קירור</h1>
  <p class="sub">שלום <b id="who"></b>. שישה מבחנים ושיעורים, עם הסבר אחרי כל תשובה. בוחרים מבחן ומתחילים.</p>
      <button type="button" class="test" data-i="0">
        <span class="n">1</span>
        <span class="tx"><b>מבחן מערכת קירור</b><span>מדחס, מעבה, אביזר הצרה ומאייד.</span><span class="cnt">26 שאלות</span></span>
      </button>
      <button type="button" class="test" data-i="1">
        <span class="n">2</span>
        <span class="tx"><b>מסלול לימוד קירור</b><span>תוכנית לימוד ב־9 יחידות לפי דפי הקורס, תרגול לכל יחידה ומבחן מסכם.</span><span class="cnt">95 שאלות</span></span>
      </button>
      <button type="button" class="test" data-i="2">
        <span class="n">3</span>
        <span class="tx"><b>שיעור צ&#x27;ילרים ו־VRF</b><span>12 פרקים: צ&#x27;ילר, מגדל קירור, VRF והשבת חום.</span><span class="cnt">65 שאלות</span></span>
      </button>
      <button type="button" class="test" data-i="3">
        <span class="n">4</span>
        <span class="tx"><b>שיעור מקררים ומזגנים</b><span>לפי החוברת: מקרר, הפשרה, התנעת מדחס, מזגן, קודי תקלה ופרסוסטט.</span><span class="cnt">97 שאלות</span></span>
      </button>
      <button type="button" class="test" data-i="4">
        <span class="n">5</span>
        <span class="tx"><b>מבחן אופן פעולת מערכות</b><span>12 מערכות, שלב אחרי שלב: מקרר, מזגן, Pump Down, צ&#x27;ילרים, VRF ועוד.</span><span class="cnt">114 שאלות</span></span>
      </button>
      <button type="button" class="test" data-i="5">
        <span class="n">6</span>
        <span class="tx"><b>קפילר, שובר לחץ ופרסוסטט</b><span>6 פרקים: קפילר, שסתומי התפשטות, פרסוסטט ואבחון תקלות.</span><span class="cnt">57 שאלות</span></span>
      </button>
  <p class="note">ההתקדמות נשמרת אחרי כל תשובה, בדפדפן ובמכשיר שבהם פותחים את הקובץ. בכל מבחן יש כפתור "הפסק", ואפשר לחזור לאותה שאלה.</p>
  <button type="button" class="link" id="switch">החלפת משתמש</button>
</div>
<div id="viewer" hidden>
  <div class="bar"><button type="button" class="back" id="back">חזרה לרשימה</button><b id="vtitle"></b></div>
  <iframe id="frame" title="מבחן"></iframe>
</div>

const NAMES=["1. מבחן מערכת קירור", "2. מסלול לימוד קירור", "3. שיעור צ'ילרים ו־VRF", "4. שיעור מקררים ומזגנים", "5. מבחן אופן פעולת מערכות", "6. קפילר, שובר לחץ ופרסוסטט"];
const AUTH='kq_auth', QUEUE='kq_logq';
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let PAGES=null;

function fnv(bytes){let h=0x811c9dc5;for(const x of bytes){h^=x;h=Math.imul(h,0x01000193)>>>0;}return h;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return (t^t>>>14)>>>0;};}
function unlock(pw){
  const bin=atob(ENC), n=bin.length, out=new Uint8Array(n);
  const rnd=mulberry32(fnv(new TextEncoder().encode(pw+'|kq1')));
  let r=0;
  for(let i=0;i<n;i++){ if((i&3)===0) r=rnd(); out[i]=bin.charCodeAt(i)^((r>>>(8*(i&3)))&255); }
  if(out[0]!==75||out[1]!==81||out[2]!==49||out[3]!==10) return null;
  try{ return JSON.parse(new TextDecoder('utf-8').decode(out.subarray(4))); }catch(e){ return null; }
}
const cleanName=s=>s.replace(/\s+/g,' ').trim();
function nameOk(s){ return /^[\u05D0-\u05EA '"׳״\-־]+$/.test(s) && (s.match(/[\u05D0-\u05EA]/g)||[]).length>=3; }

/* entry log: one record per opening, kept in a queue until it reaches the form */
function send(name){
  return fetch(FORM.action,{method:'POST',mode:'no-cors',keepalive:true,body:new URLSearchParams({[FORM.field]:name})});
}
function logEntry(text){
  if(!FORM.action||!FORM.field) return;
  const q=store.get(QUEUE)||[];
  q.push({n:text,t:Date.now()}); store.set(QUEUE,q); flush();
}
let flushing=false;
async function flush(){
  if(flushing||!FORM.action||!FORM.field) return; flushing=true;
  let q=store.get(QUEUE)||[];
  while(q.length){
    const it=q[0];
    const d=new Date(it.t), when=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    try{ await send(when+' | '+it.n); }catch(e){ break; }
    q.shift(); store.set(QUEUE,q);
  }
  flushing=false;
}

let USER='', CUR=-1;
function enter(name,pages){
  PAGES=pages; USER=name; $('who').textContent=name;
  $('gate').hidden=true; $('list').hidden=false; logEntry(name+' | כניסה');
}
const isErr=k=>/^(__w|w:|w(all|\d+)$)/.test(String(k));
let PROG=null, PROG_SENT='';
/* a test left in the middle (pause, back to the list, leaving the app) is reported once per change */
function reportProgress(how){
  if(!PROG||!PROG.answered) return;
  const sig=PROG.test+'|'+PROG.key+'|'+PROG.answered;
  if(sig===PROG_SENT) return; PROG_SENT=sig;
  const pct=Math.round(PROG.score/PROG.answered*100);
  logEntry(USER+' | '+NAMES[PROG.test]+' | '+(isErr(PROG.key)?'תרגול שגיאות, ':'')+(PROG.chip||'')+' | '+how+': ענה על '+PROG.answered+' מתוך '+PROG.total+', '+PROG.score+' נכונות ('+pct+'%)');
}
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||CUR<0||e.source!==frame.contentWindow) return;
  if(d.kq==='prog'){ PROG=Object.assign({test:CUR},d); return; }
  if(d.kq==='pause'){ reportProgress('עצר באמצע'); return; }
  if(d.kq!=='score') return;
  PROG=null;
  const pct=d.total?Math.round(d.score/d.total*100):0;
  logEntry(USER+' | '+NAMES[CUR]+' | '+(isErr(d.key)?'תרגול שגיאות, ':'')+(d.chip||'')+' | סיים: '+d.score+' מתוך '+d.total+' ('+pct+'%)');
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') reportProgress('יצא באמצע'); });
window.addEventListener('pagehide',()=>reportProgress('יצא באמצע'));
$('login').addEventListener('submit',e=>{
  e.preventDefault();
  const pw=$('pw').value.trim(), name=cleanName($('nm').value);
  const pages=unlock(pw);
  if(!pages){ $('err').textContent='סיסמה שגויה.'; $('pw').focus(); return; }
  if(!nameOk(name)){ $('err').textContent='צריך לכתוב שם בעברית, לפחות 3 אותיות.'; $('nm').focus(); return; }
  $('err').textContent=''; store.set(AUTH,{n:name,p:pw}); enter(name,pages);
});
$('switch').addEventListener('click',()=>{
  store.del(AUTH); PAGES=null; $('pw').value=''; $('nm').value='';
  $('list').hidden=true; $('gate').hidden=false; $('pw').focus();
});

let frame=$('frame');
function openTest(i){
  reportProgress('יצא באמצע'); PROG=null;
  const f=document.createElement('iframe'); f.id='frame'; f.title=NAMES[i];
  frame.replaceWith(f); frame=f; CUR=i; f.srcdoc=PAGES[i];
  $('vtitle').textContent=NAMES[i];
  $('list').hidden=true; $('viewer').hidden=false; $('back').focus();
}
function closeTest(){
  reportProgress('יצא באמצע'); PROG=null;
  const f=document.createElement('iframe'); f.id='frame'; f.title='מבחן';
  frame.replaceWith(f); frame=f; CUR=-1;
  $('viewer').hidden=true; $('list').hidden=false; window.scrollTo(0,0);
}
$('list').addEventListener('click',e=>{const b=e.target.closest('.test'); if(b&&PAGES) openTest(+b.dataset.i);});
$('back').addEventListener('click',closeTest);

if(FORM.action&&FORM.field) $('lognote').hidden=false;
(function(){
  const a=store.get(AUTH);
  if(a&&a.p&&a.n&&nameOk(a.n)){ const pages=unlock(a.p); if(pages){ enter(a.n,pages); return; } }
  flush(); $('pw').focus();
})();
window.addEventListener('online',flush);
</script>
